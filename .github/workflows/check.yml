name: Research checks and final theorem gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-lemmas:
    name: Python certificates and local Lean lemmas
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned elan
        shell: bash
        run: |
          curl -fsSL --retry 3 -o /tmp/elan.tar.gz https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          echo '42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  /tmp/elan.tar.gz' | sha256sum -c -
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reproduce Python certificates
        run: bash scripts/check_python.sh
      - name: Check source integrity and proof shortcuts
        run: python3 scripts/source_guard.py
      - name: Restore project build cache
        id: project-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .lake/build
          key: ${{ runner.os }}-lean4341-physical-v2-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lean4341-physical-v2-
      - name: Fetch the official pinned Mathlib cache
        run: lake exe cache get
      - name: Build local proofs and audit their axioms
        run: bash scripts/check_lean.sh
      - name: Build concrete native supplier and paired controller
        run: lake build Submission.Native.Supplier:olean Submission.Chain.Controller:olean
      - name: Audit concrete supplier and controller axioms
        run: |
          python3 scripts/audit_axioms.py --file Submission/NativeAudit.lean --receipt certificates/native_axioms.json --scope "modified native supplier; not GLiveKernelM"
          python3 scripts/audit_axioms.py --file Submission/ChainAudit.lean --receipt certificates/chain_axioms.json --scope "scalar paired controller; not physical GWord realization"
      - name: Build physical arrays, windows and schedule accounting
        run: lake build Submission.Native.HelperHistogram:olean Submission.Chain.Compiler:olean Submission.Chain.ScheduleHistogram:olean Submission.Chain.Physical.NativeStages:olean Submission.Chain.Physical.Windows:olean
      - name: Audit physical finite operator theorems
        run: python3 scripts/audit_axioms.py --file Submission/PhysicalAudit.lean --receipt certificates/physical_axioms.json --scope "physical finite primitives and scalar controller; GLiveKernelM still open"
      - name: Reproduce native and controller Lean certificates
        run: |
          python3 scripts/generate_native_lean.py .
          python3 scripts/generate_controller_lean.py .
      - name: Check deterministic generated sources
        run: git diff --exit-code -- Submission/ inventory_receipt.json moment_receipt.json certificates/
      - name: Require the exact final theorem
        run: bash scripts/check_final.sh
      - name: Save incremental project build cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .lake/build
          key: ${{ runner.os }}-lean4341-physical-v2-${{ github.sha }}
