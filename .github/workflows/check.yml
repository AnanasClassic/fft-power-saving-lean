name: Delta 0.005 finite research (not a Lean proof)
on:
  push:
    branches: [research/delta-005]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Cost-aware intermediate-stop search and exact literal replay
        run: python3 -u research/delta005/refine.py --rounds 64 --budget 120
      - name: Retain research evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: delta005-research-evidence
          path: research/delta005/out
          retention-days: 14
